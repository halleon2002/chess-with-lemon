<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cờ Thú – isometric board preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14181f; color: #e8ecf3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 1.1rem; margin: 6px 0 10px; }
  .panel { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 18px; background: #1c222c; border: 1px solid #333c4c; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 0.82rem; color: #aab3c4; }
  label b { color: #e8ecf3; font-weight: 600; }
  label.row { flex-direction: row; align-items: center; gap: 8px; }
  input[type=range] { width: 100%; }
  #stage { border-radius: 14px; overflow: hidden; background: #0b1d2a; touch-action: manipulation; }
  #stage svg { display: block; width: 100%; height: auto; max-height: 82vh; }
  #hint { font-size: 0.8rem; color: #aab3c4; margin: 8px 2px 0; min-height: 1.2em; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: #232a36; color: #e8ecf3; border: 1px solid #333c4c; border-radius: 8px; padding: 7px 12px; font-size: 0.82rem; cursor: pointer; }
  button:hover { border-color: #f4c063; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cờ Thú – isometric board preview <span style="font-weight:400;color:#aab3c4">(board only, placeholder pieces)</span></h1>

  <div class="panel">
    <label><span>Turn the board: <b id="yawVal">26</b>°</span><input id="yaw" type="range" min="8" max="55" value="26"></label>
    <label><span>Tilt: <b id="pitchVal">52</b>°</span><input id="pitch" type="range" min="34" max="72" value="52"></label>
    <label class="row"><input id="flip" type="checkbox"> View from Red's side (Red at the bottom)</label>
    <label class="row"><input id="pieces" type="checkbox" checked> Show placeholder pieces</label>
    <div class="btns">
      <button data-preset="26,52">Phone (portrait)</button>
      <button data-preset="34,46">Wide</button>
      <button data-preset="45,42">Classic isometric</button>
    </div>
  </div>

  <div id="stage"></div>
  <div id="hint">Move the mouse or tap over the board: the cell under the pointer is outlined.</div>
</div>

<script src="js/cothu-iso.js"></script>
<script>
  // Starting layout (same as CT.createBoard in cothu.js)
  const LAYOUT = [["lion",0,0,"top"],["tiger",6,0,"top"],["dog",1,1,"top"],["cat",5,1,"top"],["rat",0,2,"top"],["leopard",2,2,"top"],["wolf",4,2,"top"],["elephant",6,2,"top"],
                  ["tiger",0,8,"bottom"],["lion",6,8,"bottom"],["cat",1,7,"bottom"],["dog",5,7,"bottom"],["elephant",0,6,"bottom"],["wolf",2,6,"bottom"],["leopard",4,6,"bottom"],["rat",6,6,"bottom"]]
                 .map(([type,x,y,owner]) => ({ type, x, y, owner }));

  const $ = id => document.getElementById(id);
  const stage = $("stage");
  let scene = null;

  function cellName(x, y) { return "abcdefg"[x] + (9 - y); } // same notation as ctSquareName() in cothu.js

  function draw() {
    scene = CTIso.render({
      yaw: +$("yaw").value, pitch: +$("pitch").value, scale: 64,
      flip: $("flip").checked, pieces: $("pieces").checked ? LAYOUT : []
    });
    stage.innerHTML = scene.svg;
    const svg = stage.querySelector("svg");
    const hl = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
    hl.setAttribute("fill", "rgba(255,255,255,0.18)");
    hl.setAttribute("stroke", "#fff");
    hl.setAttribute("stroke-width", "3");
    hl.setAttribute("stroke-linejoin", "round");
    hl.setAttribute("pointer-events", "none");
    hl.style.display = "none";
    svg.appendChild(hl);

    function cellAt(evt) {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX; pt.y = evt.clientY;
      const m = svg.getScreenCTM();
      if (!m) return null;
      const p = pt.matrixTransform(m.inverse());
      let hit = null;
      Object.keys(scene.cells).forEach(k => {
        const poly = scene.cells[k].top;
        if (inside(p.x, p.y, poly)) hit = k;
      });
      return hit;
    }
    function onMove(evt) {
      const k = cellAt(evt);
      if (!k) { hl.style.display = "none"; return; }
      hl.setAttribute("points", scene.cells[k].top.map(p => p[0] + "," + p[1]).join(" "));
      hl.style.display = "";
      const [x, y] = k.split(",").map(Number);
      const kind = CTIso.isRiver(x, y) ? "river" : CTIso.denOwner(x, y) ? "den" : CTIso.trapOwner(x, y) ? "trap" : "land";
      $("hint").textContent = "Cell " + cellName(x, y) + " – " + kind;
    }
    svg.addEventListener("pointermove", onMove);
    svg.addEventListener("pointerdown", onMove);
    svg.addEventListener("pointerleave", () => { hl.style.display = "none"; });
  }

  function inside(px, py, poly) { // point in convex polygon
    let sign = 0;
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const cross = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]);
      if (cross !== 0) { if (sign === 0) sign = cross > 0 ? 1 : -1; else if ((cross > 0 ? 1 : -1) !== sign) return false; }
    }
    return true;
  }

  function sync() { $("yawVal").textContent = $("yaw").value; $("pitchVal").textContent = $("pitch").value; draw(); }
  ["yaw", "pitch", "flip", "pieces"].forEach(id => $(id).addEventListener("input", sync));
  document.querySelectorAll("[data-preset]").forEach(b => b.addEventListener("click", () => {
    const [y, p] = b.dataset.preset.split(",");
    $("yaw").value = y; $("pitch").value = p; sync();
  }));
  sync();
</script>
</body>
</html>
