<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lemon Together</title>
	<link rel="icon" type="image/png" href="images/lemon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#d9973f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

</head>
<body class="landing">

  <!-- Login / signup gate — shown until the user is authenticated -->
  <div class="overlay show" id="authScreen">
    <div class="overlay-card">
      <h2 id="authTitle" data-i18n="authLoginTitle">Log in</h2>
      <form id="authForm">
        <input id="authEmail" class="auth-input" type="email" autocomplete="email" required data-i18n-placeholder="authEmailPlaceholder" placeholder="Email">
        <input id="authPassword" class="auth-input" type="password" autocomplete="current-password" required minlength="6" style="margin-top:8px;" data-i18n-placeholder="authPasswordPlaceholder" placeholder="Password">
        <div id="authError" class="auth-error"></div>
        <button id="authSubmitBtn" class="start-btn" type="submit" data-i18n="authLoginBtn">Log in</button>
      </form>
      <div class="back-link" id="authToggleBtn" data-i18n="authToggleToSignup">Need an account? Sign up</div>
    </div>
  </div>

  <div id="appRoot" class="hidden">

  <!-- Scrolls with the page instead of floating fixed over the board — a
       fixed header used to end up covering the board on tall boards / small
       phone screens once the player scrolled down. -->
  <div class="top-bar">
    <div id="userBadge" class="user-badge hidden">
      <span id="userEmailLabel"></span>
      <button id="logoutBtn" data-i18n="logoutBtn">Log out</button>
    </div>
    <div class="top-bar-right">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>
      <button id="langToggle" class="lang-toggle">VI</button>
    </div>
  </div>

  <h1 id="gameTitle" data-i18n="appTitle">Board Games</h1>
  <div class="subtitle" id="subtitle" data-i18n="chooseGameToBegin">Choose a game to begin.</div>

  <div class="status-bar">
    <div class="status-item"><span class="status-dot" id="turnDot"></span><span id="turnLabel">Turn</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span id="pieceCount">&nbsp;</span></div>
  </div>

  <div class="board-row">
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Move list — chess only for now, hidden for other games -->
      <div id="moveHistoryPanel" class="move-history-panel" style="display:none;">
        <div class="move-history-header" data-i18n="movesTitle">Moves</div>
        <div id="moveHistoryList" class="move-history-list"></div>
      </div>
    </div>
  </div>

  <!-- Online chat: only shown/enabled during an active online match -->
  <button id="chatToggleBtn" class="chat-toggle" style="display:none;">
    💬<span id="chatBadge" class="chat-badge" style="display:none;">0</span>
  </button>
  <div id="chatPanel" class="chat-panel">
    <div class="chat-header">
      <span data-i18n="chatTitle">Chat</span>
      <button id="chatCloseBtn" class="chat-close">&times;</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chatInput" class="chat-input" data-i18n-placeholder="chatPlaceholder" placeholder="Type a message...">
      <button id="chatSendBtn" class="chat-send" data-i18n="chatSendBtn">Send</button>
    </div>
  </div>

  <div class="controls">
    <button id="restartBtn" data-i18n="newGame">New Game</button>
    <button id="changeModeBtn" data-i18n="changeMode">Change Mode</button>
  </div>

  <!-- Top-level game chooser -->
  <div class="overlay show" id="gameChoiceScreen">
    <div class="overlay-card">
      <h2 data-i18n="chooseGameTitle">Choose a Game</h2>
      <p data-i18n="chooseGameSubtitle">Pick a game below.</p>
      <div class="game-pick-row">
        <button class="game-pick-btn" data-game="kap">
          <span class="game-pick-icon game-pick-icon-kap" aria-hidden="true">
            <svg viewBox="0 0 680 760">
              <defs>
                <linearGradient id="kapIconBg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="#0a1d3e"/>
                  <stop offset="55%" stop-color="#123569"/>
                  <stop offset="100%" stop-color="#0a1d3e"/>
                </linearGradient>
                <radialGradient id="kapIconGlow" cx="50%" cy="62%" r="42%">
                  <stop offset="0%" stop-color="#fdf6e3" stop-opacity="0.95"/>
                  <stop offset="45%" stop-color="#cfe0ff" stop-opacity="0.35"/>
                  <stop offset="100%" stop-color="#0a1d3e" stop-opacity="0"/>
                </radialGradient>
              </defs>
              <rect x="0" y="0" width="680" height="760" fill="url(#kapIconBg)"/>
              <circle cx="340" cy="400" r="300" fill="none" stroke="#9fb6e8" stroke-width="0.6" opacity="0.18"/>
              <circle cx="340" cy="400" r="255" fill="none" stroke="#9fb6e8" stroke-width="0.5" opacity="0.12"/>
              <g stroke="#cfe0ff" stroke-width="0.5" opacity="0.2" fill="none">
                <line x1="150" y1="90" x2="60" y2="40"/>
                <line x1="150" y1="90" x2="95" y2="150"/>
                <line x1="530" y1="90" x2="620" y2="40"/>
                <line x1="530" y1="90" x2="585" y2="150"/>
                <line x1="90" y1="600" x2="40" y2="660"/>
                <line x1="590" y1="600" x2="640" y2="660"/>
              </g>
              <g fill="#eef3ff">
                <g opacity="0.85" transform="translate(60,40)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
                <g opacity="0.75" transform="translate(620,46) scale(0.8)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
                <g opacity="0.7" transform="translate(40,660) scale(0.7)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
                <g opacity="0.7" transform="translate(640,655) scale(0.9)"><path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/></g>
                <circle cx="95" cy="150" r="2.4" opacity="0.6"/>
                <circle cx="585" cy="150" r="2.2" opacity="0.55"/>
                <circle cx="130" cy="230" r="1.8" opacity="0.5"/>
                <circle cx="560" cy="250" r="2" opacity="0.5"/>
                <circle cx="70" cy="340" r="1.6" opacity="0.4"/>
                <circle cx="615" cy="360" r="1.8" opacity="0.45"/>
                <circle cx="90" cy="600" r="2" opacity="0.5"/>
                <circle cx="590" cy="600" r="2.2" opacity="0.5"/>
                <circle cx="160" cy="680" r="1.6" opacity="0.4"/>
                <circle cx="520" cy="690" r="1.8" opacity="0.45"/>
                <circle cx="340" cy="60" r="2.4" opacity="0.6"/>
                <circle cx="230" cy="700" r="1.6" opacity="0.4"/>
              </g>
              <rect x="0" y="0" width="680" height="760" fill="url(#kapIconGlow)"/>
              <g fill="none" stroke="#f4e3b8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                <path d="M230 420 C195 410 180 435 188 470 C194 495 218 505 242 495" opacity="0.85"/>
                <path d="M242 495 C262 505 284 495 280 472" opacity="0.85"/>
                <path d="M450 420 C485 410 500 435 492 470 C486 495 462 505 438 495" opacity="0.85"/>
                <path d="M438 495 C418 505 396 495 400 472" opacity="0.85"/>
                <path d="M330 190 L330 165 M350 190 L350 165 M320 172 L360 172" stroke-width="5"/>
                <circle cx="340" cy="207" r="10"/>
                <path d="M295 245 Q307 228 320 245 Q332 228 340 245 Q348 228 360 245 Q372 228 385 245 L378 262 L302 262 Z"/>
                <path d="M310 262 C305 300 310 320 340 330 C370 320 375 300 370 262" stroke-width="2"/>
                <path d="M320 330 C290 360 282 410 300 470 C310 505 370 505 380 470 C398 410 390 360 360 330" stroke-width="2.2"/>
                <path d="M278 470 C310 450 370 450 402 470 L412 505 C360 530 320 530 268 505 Z" stroke-width="2.2"/>
                <ellipse cx="340" cy="512" rx="78" ry="14" stroke-width="2"/>
              </g>
              <g fill="none" stroke="#f4e3b8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
                <g transform="translate(190,0)">
                  <circle cx="0" cy="400" r="22"/>
                  <path d="M-20 428 C-25 448 -22 462 0 468 C22 462 25 448 20 428" stroke-width="1.6"/>
                  <path d="M-15 468 C-32 485 -36 512 -25 540 C-18 558 18 558 25 540 C36 512 32 485 15 468"/>
                  <path d="M-42 540 C-22 528 22 528 42 540 L48 560 C15 574 -15 574 -48 560 Z"/>
                  <ellipse cx="0" cy="564" rx="46" ry="9"/>
                </g>
                <g transform="translate(490,0)">
                  <circle cx="0" cy="400" r="22"/>
                  <path d="M-20 428 C-25 448 -22 462 0 468 C22 462 25 448 20 428" stroke-width="1.6"/>
                  <path d="M-15 468 C-32 485 -36 512 -25 540 C-18 558 18 558 25 540 C36 512 32 485 15 468"/>
                  <path d="M-42 540 C-22 528 22 528 42 540 L48 560 C15 574 -15 574 -48 560 Z"/>
                  <ellipse cx="0" cy="564" rx="46" ry="9"/>
                </g>
              </g>
            </svg>
          </span>
          <strong data-i18n="gcKapTitle">Kings &amp; Pawns</strong>
        </button>
        <button class="game-pick-btn" data-game="checkers">
          <span class="game-pick-icon game-pick-icon-checkers" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle class="gpi-a" cx="25" cy="30" r="15"/>
              <circle class="gpi-a-line" cx="25" cy="30" r="9" fill="none"/>
              <circle class="gpi-b" cx="41" cy="44" r="15"/>
              <circle class="gpi-b-line" cx="41" cy="44" r="9" fill="none"/>
            </svg>
          </span>
          <strong data-i18n="gcCheckersTitle">Checkers</strong>
        </button>
        <button class="game-pick-btn" data-game="cothu">
          <span class="game-pick-icon game-pick-icon-cothu" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <ellipse class="gpi-a" cx="32" cy="38" rx="15" ry="12"/>
              <ellipse class="gpi-b" cx="14" cy="22" rx="6" ry="7" transform="rotate(-18 14 22)"/>
              <ellipse class="gpi-b" cx="26" cy="14" rx="6" ry="7" transform="rotate(-6 26 14)"/>
              <ellipse class="gpi-b" cx="40" cy="13" rx="6" ry="7" transform="rotate(6 40 13)"/>
              <ellipse class="gpi-b" cx="51" cy="21" rx="6" ry="7" transform="rotate(18 51 21)"/>
            </svg>
          </span>
          <strong data-i18n="gcCothuTitle">Cờ Thú (Jungle Chess)</strong>
        </button>
        <button class="game-pick-btn" data-game="chess">
          <span class="game-pick-icon game-pick-icon-chess" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path class="gpi-a" d="M30 10h4v5h5v4h-5v5h-4v-5h-5v-4h5z"/>
              <path class="gpi-a" d="M22 46c0-13 4-18 10-18s10 5 10 18z"/>
              <rect class="gpi-a" x="19" y="46" width="26" height="7" rx="2"/>
            </svg>
          </span>
          <strong data-i18n="gcChessTitle">Chess</strong>
        </button>
      </div>
    </div>
  </div>

  <!-- Mode-select screen (shared, relabeled per game) -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <h2 id="modeScreenTitle">Kings &amp; Pawns</h2>
      <p data-i18n="modeScreenSubtitle">Choose your side and opponent</p>
      <div id="eloRatingLine" class="elo-rating-line"></div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="playAsLabel">Play as</div>
        <div class="mode-buttons" id="sideButtons">
          <button data-value="a" class="mode-btn active">King</button>
          <button data-value="b" class="mode-btn">Pawn</button>
        </div>
      </div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="opponentLabel">Opponent</div>
        <div class="mode-buttons" id="opponentButtons">
          <button data-value="ai" class="mode-btn active" data-i18n="aiBtn">AI</button>
          <button data-value="player" class="mode-btn" data-i18n="localBtn">Local Player (2P)</button>
          <button data-value="online" class="mode-btn" data-i18n="onlineBtn">Online</button>
        </div>
      </div>

      <div class="mode-group" id="ctDifficultyGroup" style="display:none;">
        <div class="mode-label" data-i18n="difficultyLabel">Difficulty</div>
        <div class="mode-buttons" id="difficultyButtons">
          <button data-value="easy" class="mode-btn" data-i18n="difficultyEasy">Easy</button>
          <button data-value="medium" class="mode-btn active" data-i18n="difficultyMedium">Medium</button>
          <button data-value="hard" class="mode-btn" data-i18n="difficultyHard">Hard</button>
        </div>
      </div>

      <div class="mode-group" id="onlinePanel" style="display:none;">
        <div class="mode-buttons" id="onlineTabButtons" style="margin-bottom:10px;">
          <button data-value="create" class="mode-btn active online-tab" data-i18n="createRoomBtn">Create Room</button>
          <button data-value="join" class="mode-btn online-tab" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="createTab">
          <button id="createRoomBtn" class="start-btn" style="margin-top:0;" data-i18n="createRoomBtn">Create Room</button>
          <div id="roomCodeDisplay" class="room-code" style="display:none;"></div>
        </div>

        <div id="joinTab" style="display:none;">
          <input id="joinCodeInput" class="room-input" data-i18n-placeholder="roomCodePlaceholder" placeholder="Enter room code" maxlength="6" autocapitalize="characters">
          <button id="joinRoomBtn" class="start-btn" style="margin-top:8px;" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="onlineStatus" class="online-status"></div>
      </div>

      <button id="startBtn" class="start-btn" data-i18n="startGameBtn">Start Game</button>
      <div class="back-link" id="backToGameChoice" data-i18n="backToGameChoice">&larr; Choose a different game</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Kings Win!</h2>
      <p id="overlaySubtitle">All pawns have been captured.</p>
      <div id="scoreLine" class="score-line"></div>
      <div id="eloDeltaLine" class="elo-delta-line"></div>
      <button id="overlayRestartBtn" data-i18n="rematchBtn">Rematch</button>
      <button id="overlayReviewBtn" style="margin-top:8px;" data-i18n="reviewBtn">Review</button>
    </div>
  </div>

</div><!-- /#appRoot -->

<script src="js/board-core.js"></script>
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/elo.js"></script>
<script src="js/kap.js"></script>
<script src="js/checkers.js"></script>
<script src="js/cothu.js"></script>
<script src="js/chess.js"></script>
<script src="js/games.js"></script>
<script src="js/cothu-images.js"></script>
<script src="js/chess-images.js"></script>
<script src="js/rendering.js"></script>
<script src="js/network.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
