    <title>Lemon Together</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <meta name="theme-color" content="#d9973f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

</head>
<body class="landing">

  <!-- Login / signup gate — shown until the user is authenticated -->
  <div class="overlay show" id="authScreen">
    <div class="overlay-card">
      <h2 id="authTitle" data-i18n="authLoginTitle">Log in</h2>
      <form id="authForm">
        <input id="authEmail" class="auth-input" type="email" autocomplete="email" required data-i18n-placeholder="authEmailPlaceholder" placeholder="Email">
        <input id="authPassword" class="auth-input" type="password" autocomplete="current-password" required minlength="6" style="margin-top:8px;" data-i18n-placeholder="authPasswordPlaceholder" placeholder="Password">
        <div id="authError" class="auth-error"></div>
        <button id="authSubmitBtn" class="start-btn" type="submit" data-i18n="authLoginBtn">Log in</button>
      </form>
      <div class="back-link" id="authToggleBtn" data-i18n="authToggleToSignup">Need an account? Sign up</div>
    </div>
  </div>

  <div id="appRoot" class="hidden">

  <!-- Scrolls with the page instead of floating fixed over the board — a
       fixed header used to end up covering the board on tall boards / small
       phone screens once the player scrolled down. -->
  <div class="top-bar">
    <div id="userBadge" class="user-badge hidden">
      <span id="userEmailLabel"></span>
      <button id="logoutBtn" data-i18n="logoutBtn">Log out</button>
    </div>
    <div class="top-bar-right">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark theme">🌙</button>
      <button id="langToggle" class="lang-toggle">VI</button>
    </div>
  </div>

  <h1 id="gameTitle" data-i18n="appTitle">Board Games</h1>
  <div class="subtitle" id="subtitle" data-i18n="chooseGameToBegin">Choose a game to begin.</div>

  <div class="status-bar">
    <div class="status-item"><span class="status-dot" id="turnDot"></span><span id="turnLabel">Turn</span></div>
    <div class="status-divider"></div>
    <div class="status-item"><span id="pieceCount">&nbsp;</span></div>
  </div>

  <div class="board-row">
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 450 450" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Move list — chess only for now, hidden for other games -->
      <div id="moveHistoryPanel" class="move-history-panel" style="display:none;">
        <div class="move-history-header" data-i18n="movesTitle">Moves</div>
        <div id="moveHistoryList" class="move-history-list"></div>
      </div>
    </div>
  </div>

  <!-- Online chat: only shown/enabled during an active online match -->
  <button id="chatToggleBtn" class="chat-toggle" style="display:none;">
    💬<span id="chatBadge" class="chat-badge" style="display:none;">0</span>
  </button>
  <div id="chatPanel" class="chat-panel">
    <div class="chat-header">
      <span data-i18n="chatTitle">Chat</span>
      <button id="chatCloseBtn" class="chat-close">&times;</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <input id="chatInput" class="chat-input" data-i18n-placeholder="chatPlaceholder" placeholder="Type a message...">
      <button id="chatSendBtn" class="chat-send" data-i18n="chatSendBtn">Send</button>
    </div>
  </div>

  <div class="controls">
    <button id="restartBtn" data-i18n="newGame">New Game</button>
    <button id="changeModeBtn" data-i18n="changeMode">Change Mode</button>
  </div>

  <!-- Mode-select screen (shared, relabeled per game) -->
  <div class="overlay" id="startScreen">
    <div class="overlay-card">
      <h2 id="modeScreenTitle">Kings &amp; Pawns</h2>
      <p data-i18n="modeScreenSubtitle">Choose your side and opponent</p>
      <div id="eloRatingLine" class="elo-rating-line"></div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="playAsLabel">Play as</div>
        <div class="mode-buttons" id="sideButtons">
          <button data-value="a" class="mode-btn active">King</button>
          <button data-value="b" class="mode-btn">Pawn</button>
        </div>
      </div>

      <div class="mode-group">
        <div class="mode-label" data-i18n="opponentLabel">Opponent</div>
        <div class="mode-buttons" id="opponentButtons">
          <button data-value="ai" class="mode-btn active" data-i18n="aiBtn">AI</button>
          <button data-value="player" class="mode-btn" data-i18n="localBtn">Local Player (2P)</button>
          <button data-value="online" class="mode-btn" data-i18n="onlineBtn">Online</button>
        </div>
      </div>

      <div class="mode-group" id="ctDifficultyGroup" style="display:none;">
        <div class="mode-label" data-i18n="difficultyLabel">Difficulty</div>
        <div class="mode-buttons" id="difficultyButtons">
          <button data-value="easy" class="mode-btn" data-i18n="difficultyEasy">Easy</button>
          <button data-value="medium" class="mode-btn active" data-i18n="difficultyMedium">Medium</button>
          <button data-value="hard" class="mode-btn" data-i18n="difficultyHard">Hard</button>
        </div>
      </div>

      <div class="mode-group" id="onlinePanel" style="display:none;">
        <div class="mode-buttons" id="onlineTabButtons" style="margin-bottom:10px;">
          <button data-value="create" class="mode-btn active online-tab" data-i18n="createRoomBtn">Create Room</button>
          <button data-value="join" class="mode-btn online-tab" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="createTab">
          <button id="createRoomBtn" class="start-btn" style="margin-top:0;" data-i18n="createRoomBtn">Create Room</button>
          <div id="roomCodeDisplay" class="room-code" style="display:none;"></div>
        </div>

        <div id="joinTab" style="display:none;">
          <input id="joinCodeInput" class="room-input" data-i18n-placeholder="roomCodePlaceholder" placeholder="Enter room code" maxlength="6" autocapitalize="characters">
          <button id="joinRoomBtn" class="start-btn" style="margin-top:8px;" data-i18n="joinRoomBtn">Join Room</button>
        </div>

        <div id="onlineStatus" class="online-status"></div>
      </div>

      <button id="startBtn" class="start-btn" data-i18n="startGameBtn">Start Game</button>
      <div class="back-link" id="backToGameChoice" data-i18n="backToGameChoice">&larr; Choose a different game</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2 id="overlayTitle">Kings Win!</h2>
      <p id="overlaySubtitle">All pawns have been captured.</p>
      <div id="scoreLine" class="score-line"></div>
      <div id="eloDeltaLine" class="elo-delta-line"></div>
      <button id="overlayRestartBtn" data-i18n="rematchBtn">Rematch</button>
      <button id="overlayReviewBtn" style="margin-top:8px;" data-i18n="reviewBtn">Review</button>
    </div>
  </div>

</div><!-- /#appRoot -->
